<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Clarity — a minimalist to-do list that syncs across your devices." />
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070809" media="(prefers-color-scheme: dark)" />
    <!--
      Installability. On iOS this is not cosmetic: Safari only exposes the
      Notification API to a web app that has been added to the Home Screen, so
      without a manifest and an apple-touch-icon a reminder can never reach the
      phone at all.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Clarity" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Clarity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the theme before first paint so the app never flashes the
      // wrong background. Light is the default; dark is opt-in and remembered.
      // A host page embedding Clarity can override later via postMessage.
      (function () {
        try {
          var saved = localStorage.getItem('clarity.theme.v1');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;

          var scales = { sm: '0.9', md: '1', lg: '1.15', xl: '1.3' };
          var size = localStorage.getItem('clarity.fontsize.v1');
          if (scales[size]) document.documentElement.style.setProperty('--fs', scales[size]);

          // Non-default UI faces are requested here rather than after hydration,
          // so a chosen font is already downloading during first paint.
          // Keep in sync with src/store/fonts.ts.
          var fonts = {
            chakra: ['Chakra+Petch:wght@400;500;600;700', '"Chakra Petch"'],
            exo: ['Exo+2:wght@400;500;600;700', '"Exo 2"'],
            plex: ['IBM+Plex+Sans:wght@400;500;600;700', '"IBM Plex Sans"'],
            mono: ['JetBrains+Mono:wght@400;500;600;700', '"JetBrains Mono"']
          };
          var face = fonts[localStorage.getItem('clarity.fontfamily.v1')];
          if (face) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://fonts.googleapis.com/css2?family=' + face[0] + '&display=swap';
            document.head.appendChild(link);
            document.documentElement.style.setProperty(
              '--ui-font',
              face[1] + ', "Space Grotesk", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'
            );
          }
        } catch (e) {
          /* keep the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
